# Default pipeline configuration. Override with --config my.yaml or --set section.key=value.
# Everything model-dependent or expensive is configurable here; nothing is hard-coded.

project:
  data_dir: data
  db_path: null            # default: <data_dir>/state.db
  log_level: INFO
  device: cuda             # auto | cuda | mps | cpu - Force CUDA for GPU
  seed: 1234
  ffmpeg_path: null        # null -> search PATH, then the imageio-ffmpeg bundled binary
  ffprobe_path: null

download:
  provider: yt_dlp
  max_resolution: 1080
  format: mp4
  cookies_file: null       # only for videos you are authorized to access (exported Netscape cookies.txt)
  cookies_from_browser: null  # e.g. chrome, "chrome:Profile 1", firefox, edge - read cookies straight from the browser
  cookies_optional: true   # true: if cookies cannot be loaded (Chrome locked / DPAPI on Windows, missing file)
                           # log a warning and download without them; false: fail the video instead
  rate_limit: null         # e.g. "4M"
  retries: 3
  concurrency: 2
  skip_existing: true
  socket_timeout: 30
  extra_args: {}           # passed straight to yt-dlp options
  allowed_domains: []      # e.g. [youtube.com, youtu.be]; empty = any http(s) site yt-dlp supports

limits:
  max_duration_seconds: null   # No limit - accept any video duration
  max_file_size_gb: null       # No limit on file size
  min_free_disk_gb: 5          # DOWNLOAD / PREPROCESS / FRAME_EXTRACTION refuse to start below this
  disk_check_stages: [DOWNLOAD, PREPROCESS, FRAME_EXTRACTION]

preprocess:
  audio_sample_rate: 16000 # 16 kHz mono PCM is what speech models expect
  audio_channels: 1
  transcode_if_needed: true
  decodable_codecs: [h264, hevc, vp9, av1, mpeg4, vp8]
  max_transcode_height: 1080

scene_detection:
  detector: content        # content | adaptive | threshold
  threshold: 27.0          # ContentDetector threshold (HSV delta)
  adaptive_threshold: 3.0
  fade_threshold: 12.0     # ThresholdDetector luminance threshold for fades
  min_scene_len_seconds: 0.6
  detect_fades: true
  max_scene_duration: 60.0 # over-long shots are split for analysis; splits are marked, not treated as cuts
  frame_skip: 0
  downscale: null          # null = automatic
  detect_dissolves: true   # a boundary whose content change spans several frames is a dissolve, not a cut
  dissolve_min_frames: 3

frame_sampling:
  min_frames_per_scene: 3
  max_frames_per_scene: 20
  motion_aware: true
  scene_boundary_frames: true
  boundary_offset_seconds: 0.15
  analysis_fps: 4.0        # decode rate of the low-resolution scan pass
  analysis_width: 160
  change_threshold: 0.12   # normalized visual change that earns an extra frame
  min_frame_gap_seconds: 0.5
  max_frame_gap_seconds: 5.0  # frames are added into the largest gaps of a shot until none exceeds this (validation checks the same limit)
  jpeg_quality: 90
  max_frame_side: 1280
  compute_optical_flow: true
  extract_clips: true
  clip_max_duration: 30.0
  clip_codec: auto         # auto (stream-copy, re-encode clips that miss the boundary) | libx264 (always exact) | copy (keyframe aligned only)
  clip_tolerance_seconds: 0.25  # a clip whose real length differs from the scene by more than this is re-cut (auto) or flagged (copy)
  clip_max_height: 1080   # re-encoded clips are downscaled to this height
  workers: null            # threads for frame extraction + clip cutting; null -> pipeline.stage_workers
  drop_duplicate_frames: true   # sampled frames whose perceptual hash matches an earlier frame of the scene are dropped
  duplicate_frame_hamming: 4    # dHash bits that may differ for two frames to count as the same image
  normalize_clips: false   # true: every clip is re-encoded to target_fps / target size (uniform training media, slower)
  target_fps: null         # e.g. 24
  target_height: null      # e.g. 480
  target_width: null       # e.g. 854 (with target_height; aspect_mode decides how the source is fitted)
  aspect_mode: scale       # scale (fit inside, keep aspect) | pad (letterbox to WxH) | crop (centre-crop to WxH)

transcription:
  enabled: true
  provider: faster_whisper # faster_whisper | transformers | mock | none
  model: base              # tiny | base | small | medium | large-v3 (or a HF repo id for transformers)
  language: auto
  compute_type: auto       # auto -> float16 on CUDA, int8 on CPU
  beam_size: 5
  vad_filter: true
  word_timestamps: true
  min_segment_confidence: 0.0
  initial_prompt: null     # bias the decoder, e.g. a Devanagari sentence to keep Hindi output in Devanagari script
  device: null

audio_events:
  enabled: true
  provider: energy         # energy (heuristic, never guesses sound type) | transformers (AudioSet classifier) | none
  model: MIT/ast-finetuned-audioset-10-10-0.4593
  window_seconds: 2.0
  hop_seconds: 1.0
  min_score: 0.3
  top_k: 3
  energy_threshold_db: -45.0

ocr:
  enabled: true
  provider: rapidocr       # rapidocr | easyocr | paddleocr | mock | none
  languages: [en]
  min_confidence: 0.5
  max_frames_per_scene: 6
  merge_similarity: 0.85
  merge_max_gap_seconds: 3.0
  min_text_length: 3       # drop 1-2 character reads (noise)
  static_overlay_min_scene_fraction: 0.3  # text seen in >= 30% of scenes = watermark/handle/logo, not an event
  static_overlay_min_scenes: 4
  workers: null            # OCR threads (one engine each); null -> pipeline.stage_workers

vision:
  provider: heuristic      # heuristic | cv_models | hf | anthropic | openai_compatible | mock
  yolo_model: yolov8n.pt   # YOLO model for object detection (n/s/m/l/x)
  yolo_confidence: 0.5     # Minimum confidence threshold for detections
  yolo_max_frames: 8       # frames per scene sent to YOLO / CLIP (evenly spaced)
  preset: null             # see config/models.yaml -> presets.vision
  model: null
  base_url: null
  api_key_env: null
  max_images_per_request: 6
  image_max_side: 768
  frame_captions: false
  frame_captions_per_scene: 3
  use_video_input: false
  enrichers: []            # optional grounded enrichers, e.g. [clip]
  clip_model: openai/clip-vit-base-patch32
  aesthetic: true          # LAION aesthetic predictor (linear head on the CLIP embedding, ~1..10) wherever CLIP runs
  aesthetic_weights: null  # path/URL of the .pth; null -> the head matching clip_model, downloaded once
  aesthetic_cache_dir: null  # null -> ~/.cache/video_dataset/aesthetic
  max_new_tokens: 700
  temperature: 0.0
  timeout_seconds: 120
  retries: 2
  requests_per_minute: 0   # API providers only: cap calls per minute (0 = unlimited)
  device: null
  torch_dtype: auto
  verify_with_model: true
  workers: null            # scenes analysed concurrently (measurements always; the model only when thread-safe)
  tracking: true           # cv_models: YOLO + IoU tracker on a low-rate decode of each shot -> subject path / direction
  track_fps: 3.0
  track_width: 640
  track_max_seconds: 20.0  # longest span tracked per shot
  track_iou_threshold: 0.3
  track_max_age: 2         # undetected frames before a track ends
  track_min_hits: 3        # detections a track needs to count

llm:
  provider: none           # none | anthropic | openai_compatible | mock  (text-only helper model)
  model: null
  base_url: null
  api_key_env: null
  max_tokens: 1024
  temperature: 0.2
  timeout_seconds: 120
  requests_per_minute: 0   # 0 = unlimited

temporal:
  enabled: true
  include_speech_events: true
  include_ocr_events: true
  include_static_overlay_text: false  # true: watermark / partial-read OCR tracks also become events
  include_audio_events: true
  include_camera_events: true
  include_transitions: true
  include_state_changes: true
  min_camera_consistency: 0.6
  min_camera_motion: 0.35
  max_relation_neighbors: 6
  emit_inverse_relations: true
  long_range_min_gap_seconds: 20.0
  causal_inference: none   # none | llm (requires llm.provider)
  speech_min_words: 3

qa:
  questions_per_minute: 5
  min_questions: 8
  max_questions: 400
  seed: 1234
  type_weights:
    timestamp: 1.0
    before_after: 1.5
    temporal_ordering: 1.5
    duration: 1.0
    event_localization: 1.0
    state_change: 1.0
    multi_event: 1.0
    long_range: 1.0
  ordering_min_gap_seconds: 1.0
  long_range_min_gap_seconds: 20.0
  allow_unscored_evidence: true
  paraphrase: false        # LLM paraphrasing of template questions (requires llm.provider)
  include_speech_in_answers: true
  generator: template      # template | spacy | both - template: temporal templates; spacy: dependency-parsed questions per event; both: merged
  spacy_model: en_core_web_sm  # python -m spacy download en_core_web_sm
  spacy_max_per_event: 3   # spaCy questions kept per event before the per-video target applies
  ocr_filter: true         # skip on-screen text events whose OCR text does not look like words (garbled watermark reads)
  ocr_min_chars: 4         # on-screen text shorter than this (letters+digits) never anchors a question
  ocr_max_repeats: 3       # text resembling more than this many other on-screen texts in the video = watermark / caption template
  ocr_max_question_fraction: 0.25  # max share of a video's questions anchored on on-screen text (>= 1 disables the cap)

validation:
  minimum_confidence: 0.75 # >= accepted
  review_confidence: 0.5   # >= review, below -> rejected
  verifier: heuristic      # none | heuristic | vlm | composite
  verify_sample_fraction: 1.0
  reject_on_missing_files: true
  grounding_min_overlap: 0.3
  max_vlm_verifications_per_video: 200
  workers: null            # threads for verifier calls; null -> pipeline.stage_workers
  consistency_checks: true # contradictory annotations (static camera + tracked subject, dark label on a bright frame, ...)
  reject_contradictions: true  # true: such shots are rejected; false: sent to review
  clip_alignment: auto     # auto (when CLIP is already loaded) | on | off - caption vs frames retrieval check
  clip_alignment_text: prompt  # prompt (natural-language generation prompt of the shot) | summary (measurement summary with hex colours)
  clip_alignment_min_rank_fraction: 0.75 # the shot's own caption must rank in the top three quarters of the video's captions ...
  clip_alignment_min_margin: 0.05        # ... unless the best caption beats it by less than this cosine margin (noise)
  clip_alignment_min_candidates: 4
  clip_alignment_max_frames: 3
  frame_sequence_checks: true  # frames ordered, inside the shot, no large gaps
  clip_checks: true        # clip files exist and match the shot span

quality:                   # visual-quality flags (measured); flagged shots -> review (or rejected), never gold
  min_height: 480          # source height below this -> low_resolution
  min_bitrate_kbps: 300    # source bitrate below this -> low_bitrate (0 disables)
  min_sharpness: 30.0      # variance of Laplacian below this -> blurry (0 disables)
  max_dark_fraction: 0.6   # share of near-black pixels above this -> underexposed
  max_bright_fraction: 0.4 # share of near-white pixels above this -> overexposed
  max_blockiness: 0.35     # 8x8 block-boundary ratio above this -> compression_artifacts (0 disables)
  reject_flagged: false    # true: reject flagged shots instead of review
  duration_tolerance_seconds: 1.0  # yt-dlp duration vs probed duration mismatch -> duration_mismatch flag

licensing:
  allowed: [creative_commons]  # license_status values that count as licensed for reuse
  action: flag             # flag: record license_status + "licensed" subset | reject: skip downloading other videos
  subset: true

deduplication:
  enabled: true
  near_duplicate_threshold: 0.9
  question_similarity_threshold: 0.92
  evidence_iou_threshold: 0.5
  method: minhash          # minhash | tfidf
  num_perm: 128
  shingle_size: 3
  video_fingerprint: true  # perceptual-hash fingerprint of every video -> near-duplicate videos share one canonical id and split
  video_similarity_threshold: 0.8

export:
  formats: [jsonl, parquet]
  include_review: true
  include_rejected: false
  output_dir: null         # default <data_dir>/final
  relative_paths: true
  combined_jsonl: true     # one dataset.jsonl with every record (each line carries record_type) - upload a single file
  per_type_jsonl: true     # also write frames.jsonl, clips.jsonl, scenes.jsonl, events.jsonl, temporal_qa.jsonl, ...
  per_type_parquet: true   # frames.parquet, scenes.parquet, ... with an explicit schema - what dataset loaders should read
  merge_existing: true     # rebuilding final/ keeps records of earlier videos whose per_video/ export is gone
  hard_negatives: true     # rule-built wrong answers (QA) and wrong captions (scenes, clips) for contrastive training
  hard_negatives_per_record: 3
  split:                   # train / validation / test by hash of the source video id (no leakage across scenes)
    enabled: true
    validation_fraction: 0.05
    test_fraction: 0.05
    salt: video-dataset-v1 # keep fixed to keep the split stable; change to reshuffle
  tiers:                   # gold / silver / bronze from measured signals only
    enabled: true
    gold_min_overall: 0.8
    silver_min_overall: 0.6
    gold_requires_grounding: true   # gold needs a verifier / measurement grounding component
    gold_min_confidence: 0.75
  cinematic:               # subsets: [cinematic] + final/cinematic/
    enabled: true
    min_tier: silver       # gold | silver | bronze
    min_aesthetic: 5.0     # LAION aesthetic score (1..10)
    require_aesthetic: false  # true: shots without an aesthetic score never qualify
    min_scene_duration: 1.5
    require_known_camera: true
    min_sharpness: 50.0
    write_files: true
  sequences:               # longer coherent motion sequences joined from consecutive shots -> sequences.jsonl
    enabled: true
    min_duration: 8.0
    max_duration: 120.0
    max_shots: 12
    require_same_setting: true
    require_shared_subject: true
    allow_fades: false
  prompt_variants: 3       # template + synonym rewrites of each generation_prompt (0 disables)
  exclude_duplicate_videos: false  # true: drop records of near-duplicate videos from final/

upload:
  provider: huggingface    # none | huggingface - upload final/ automatically once it reaches threshold_mb
  repo_id: raj270898/youtube-video-dataset  # "<user-or-org>/<dataset-name>"; created (private) on first upload if missing
  repo_type: dataset
  private: true
  token_env: HF_TOKEN      # write token read from the environment / .env; never put it in this file
  threshold_mb: 1024        # 250 MB: when the current shard (dataset files [+ media]) reaches this, it is uploaded
  include_media: false     # also upload frames/ and clips/ of the shard's videos (much larger)
  path_in_repo: ""         # optional prefix inside the repo, e.g. "v1"
  after_upload: delete     # archive: move the uploaded shard to final/uploaded/shard_NNNN (nothing deleted)
                           # delete:  remove the local copy (and its media when include_media) to free disk
  retries: 3

cleanup:
  after_export: all      # none | media | all - what to delete automatically once a video's EXPORT is DONE
                           # media: source download, video.mp4, audio.wav; all: every working file except
                           # the per-video export and the log
  frames_and_clips: true   # with media/all: also delete frames/<id>/ (the scene_NNN folders) and clips/<id>/
                           # once the video is done. Set false to keep the media the records point at.
                           # Ignored while upload.include_media is on (the shard needs the files first).
